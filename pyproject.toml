[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "devnovatio-pipeable"
version = "0.1.0"
description = "按段落统计命令行的可组合性相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "devnovatio" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://devnovatio.github.io"
Repository = "https://github.com/devnovatio/pipeable"
Issues = "https://github.com/devnovatio/pipeable/issues"

[project.scripts]
pipeable = "pipeable:main"

[tool.setuptools]
py-modules = ["pipeable"]
